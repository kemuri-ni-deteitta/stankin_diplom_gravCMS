title: Главная
'@extends': default

form:
  fields:
    tabs:
      fields:
        home_blocks:
          type: tab
          title: Блоки на главной
          fields:
            header.home_blocks:
              type: list
              style: vertical
              label: Блоки с текстом или видео
              collapsed: false
              btnLabel: Добавить блок
              controls: both
              placement: top
              fields:
                .block_type:
                  type: select
                  label: Тип блока
                  default: content
                  options:
                    content: Текст/медиа
                    slider: Слайдер (массовая загрузка)
                .title:
                  type: text
                  label: Заголовок (опционально)
                .text:
                  type: markdown
                  label: Текст
                  validate:
                    type: textarea
                .media_type:
                  type: select
                  label: Тип медиа
                  default: image
                  options:
                    none: Без медиа
                    image: Изображение
                    video: Видео
                .media_position:
                  type: select
                  label: Позиция медиа
                  default: right
                  options:
                    left: Слева
                    right: Справа
                .image:
                  type: file
                  label: Фото
                  multiple: false
                  limit: 1
                  filesize: 20
                  destination: '@self'
                  accept:
                    - image/jpeg
                    - image/png
                    - image/gif
                    - image/webp
                    - '.jpg'
                    - '.jpeg'
                    - '.png'
                    - '.gif'
                    - '.webp'
                  help: "Загрузите фото для блока."
                .video_upload:
                  type: file
                  label: Видео (файл)
                  multiple: false
                  limit: 1
                  filesize: 200
                  destination: '@self'
                  accept:
                    - video/mp4
                    - video/webm
                    - video/ogg
                    - '.mp4'
                    - '.webm'
                    - '.ogg'
                  help: "Загрузите видео файл."
                .poster_upload:
                  type: file
                  label: Постер (обложка)
                  multiple: false
                  limit: 1
                  filesize: 8
                  destination: '@self'
                  accept:
                    - image/jpeg
                    - image/png
                    - image/webp
                    - '.jpg'
                    - '.jpeg'
                    - '.png'
                    - '.webp'
                  help: Загрузите обложку для видео
                .video_orientation:
                  type: select
                  label: Ориентация видео
                  default: vertical
                  options:
                    vertical: Вертикальное (9:16)
                    horizontal: Горизонтальное (16:9)
                .video_url:
                  type: text
                  label: Видео (ссылка)
                  placeholder: https://example.com/video.mp4
                .video_embed:
                  type: text
                  label: Встраиваемое видео (iframe src)
                  placeholder: https://www.youtube.com/embed/...
                .slider_title:
                  type: text
                  label: Заголовок слайдера
                .slider_description:
                  type: textarea
                  label: Подзаголовок/описание слайдера
                  rows: 2
                .slider_autoplay:
                  type: toggle
                  label: Автовоспроизведение
                  highlight: 1
                  default: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                .slider_interval:
                  type: number
                  label: Интервал (мс)
                  default: 3500
                  min: 1500
                  validate:
                    type: int
                .slider_loop:
                  type: toggle
                  label: Бесконечная прокрутка
                  highlight: 1
                  default: 1
                  options:
                    1: PLUGIN_ADMIN.ENABLED
                    0: PLUGIN_ADMIN.DISABLED
                .slider_gap:
                  type: number
                  label: Расстояние между карточками (px)
                  default: 18
                  step: 1
                .slider_bulk_upload:
                  type: file
                  label: Массовая загрузка слайдов
                  multiple: true
                  filesize: 20
                  destination: '@self'
                  accept:
                    - image/jpeg
                    - image/png
                    - image/gif
                    - image/webp
                    - '.jpg'
                    - '.jpeg'
                    - '.png'
                    - '.gif'
                    - '.webp'
                  help: "Можно выбрать сразу несколько файлов — каждый станет отдельным слайдом."
