title: Главная
'@extends': default

form:
  fields:
    tabs:
      fields:
        home_slider:
          type: tab
          title: Слайдер на главной

          fields:
            header.home_slider.enabled:
              type: toggle
              label: Включить слайдер
              highlight: 1
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED

            header.home_slider.title:
              type: text
              label: Заголовок блока
              placeholder: Галерея

            header.home_slider.description:
              type: textarea
              label: Подзаголовок/описание
              rows: 2
              placeholder: Короткий текст под заголовком


            header.home_slider.autoplay:
              type: toggle
              label: Автовоспроизведение
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED

            header.home_slider.interval:
              type: number
              label: Интервал (мс)
              default: 3500
              min: 1500
              validate:
                type: int

            header.home_slider.loop:
              type: toggle
              label: Бесконечная прокрутка
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED

            header.home_slider.gap:
              type: number
              label: Расстояние между карточками (px)
              default: 18
              step: 1

            header.home_slider.bulk_upload:
              type: file
              label: Массовая загрузка слайдов
              multiple: true
              filesize: 20
              destination: '@self'
              accept:
                - image/jpeg
                - image/png
                - image/gif
                - image/webp
                - '.jpg'
                - '.jpeg'
                - '.png'
                - '.gif'
                - '.webp'
              help: "Можно выбрать сразу несколько файлов — каждый станет отдельным слайдом."

            header.home_slider.items:
              type: list
              style: vertical
              label: Слайды
              collapsed: false
              btnLabel: Добавить слайд
              controls: both
              placement: top
              fields:
                .image_upload:
                  type: file
                  label: Загрузить изображение
                  multiple: false
                  limit: 1
                  filesize: 20
                  destination: '@self'
                  accept:
                    - image/jpeg
                    - image/png
                    - image/gif
                    - image/webp
                    - '.jpg'
                    - '.jpeg'
                    - '.png'
                    - '.gif'
                    - '.webp'
                  help: "Загрузите изображение. Максимальный размер 8MB."
                  avoid_overwriting: false
                  random_name: true
                .title:
                  type: text
                  label: Подпись
                .alt:
                  type: text
                  label: Alt текст
                .link:
                  type: text
                  label: Ссылка (опционально)

        home_blocks:
          type: tab
          title: Блоки на главной
          fields:
            header.home_blocks:
              type: list
              style: vertical
              label: Блоки с текстом или видео
              collapsed: false
              btnLabel: Добавить блок
              controls: both
              placement: top
              fields:
                .title:
                  type: text
                  label: Заголовок (опционально)
                .text:
                  type: markdown
                  label: Текст
                  validate:
                    type: textarea
                .media_type:
                  type: select
                  label: Тип медиа
                  default: image
                  options:
                    none: Без медиа
                    image: Изображение
                    video: Видео
                .media_position:
                  type: select
                  label: Позиция медиа
                  default: right
                  options:
                    left: Слева
                    right: Справа
                .image:
                  type: file
                  label: Фото
                  multiple: false
                  limit: 1
                  filesize: 20
                  destination: '@self'
                  accept:
                    - image/jpeg
                    - image/png
                    - image/gif
                    - image/webp
                    - '.jpg'
                    - '.jpeg'
                    - '.png'
                    - '.gif'
                    - '.webp'
                  help: "Загрузите фото для блока."
                .video_upload:
                  type: file
                  label: Видео (файл)
                  multiple: false
                  limit: 1
                  filesize: 200
                  destination: '@self'
                  accept:
                    - video/mp4
                    - video/webm
                    - video/ogg
                    - '.mp4'
                    - '.webm'
                    - '.ogg'
                  help: "Загрузите видео файл."
                .video_url:
                  type: text
                  label: Видео (ссылка)
                  placeholder: https://example.com/video.mp4
                .video_embed:
                  type: text
                  label: Встраиваемое видео (iframe src)
                  placeholder: https://www.youtube.com/embed/...
