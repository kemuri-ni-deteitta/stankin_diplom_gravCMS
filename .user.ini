; Per-directory PHP overrides for Grav Admin (picked up by PHP-FPM/Apache)
; Fixes Invalid Security Token on large Admin forms by allowing many inputs

; Allow extremely large numbers of inputs (images, fields, etc.)
max_input_vars = 100000
max_multipart_body_parts = 50000
max_input_nesting_level = 256

; Generous POST/file limits (very high to avoid editor limits)
post_max_size = 1024M
upload_max_filesize = 512M
max_file_uploads = 200

; Timeouts high enough for big pages
max_input_time = 0
max_execution_time = 0

; Session lifetime and security flags
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.use_strict_mode = 1

; session.save_path — не задавать: на сервере PHP использует путь по умолчанию (/var/lib/php/sessions или tmp проекта)
session.cookie_httponly=1
session.use_strict_mode=1
