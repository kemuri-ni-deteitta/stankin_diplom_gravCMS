# Nginx: litrep.ru (Ubuntu 24, без Docker)
# Использовать после получения сертификата Let's Encrypt (см. DEPLOY-UBUNTU24.md).
# Копировать в /etc/nginx/sites-available/ и включить: sudo ln -s ../sites-available/litrep.conf sites-enabled/

# HTTP → редирект на HTTPS
server {
	listen 80;
	listen [::]:80;
	server_name litrep.ru www.litrep.ru;

	root /var/www/litrep;
	index index.php index.html;
	client_max_body_size 64m;

	location ^~ /.well-known/acme-challenge/ {
		default_type "text/plain";
		root /var/www/litrep;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

# HTTPS
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name litrep.ru www.litrep.ru;

	root /var/www/litrep;
	index index.php index.html;
	client_max_body_size 64m;

	access_log /var/log/nginx/litrep.access.log;
	error_log  /var/log/nginx/litrep.error.log warn;

	# Let's Encrypt (Certbot)
	ssl_certificate     /etc/letsencrypt/live/litrep.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/litrep.ru/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;

	add_header X-Content-Type-Options nosniff;
	add_header X-Frame-Options SAMEORIGIN;
	add_header X-XSS-Protection "1; mode=block";
	add_header Referrer-Policy same-origin;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	include snippets/grav-common.conf;
	include snippets/php-fpm.conf;
}
