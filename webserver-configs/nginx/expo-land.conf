# HTTP Server Block - Redirects all traffic to HTTPS
# Server: litrep
# Domain: expotest.tw1.su
server {
	# Listen on port 80 for IPv4 and IPv6
	listen 80;
	listen [::]:80;
	
	# Domain names this server block handles
	server_name expotest.tw1.su www.expotest.tw1.su;

	# Document root directory for the website files
	root /var/www/grav-admin;
	
	# Default index files to serve
	index index.html index.php;

	# Maximum allowed size for client request body (file uploads)
	client_max_body_size 32m;

	# Allow Let's Encrypt ACME challenge over HTTP for certificate validation
	# This is required for initial certificate issuance
	location ^~ /.well-known/acme-challenge/ {
		default_type "text/plain";
		root /var/www/gravExpo;
	}

	# Redirect all other HTTP requests to HTTPS for security
	location / {
		return 301 https://$host$request_uri;
	}
}

# HTTPS Server Block - Main secure server configuration
# Server: litrep
# Domain: expotest.tw1.su
server {
	# Listen on port 443 for IPv4 and IPv6 with SSL/TLS and HTTP/2 support
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	
	# Domain names this server block handles
	server_name expotest.tw1.su www.expotest.tw1.su;

	# Document root directory for the website files
	root /var/www/gravExpo;
	
	# Default index files to serve
	index index.html index.php;

	# Maximum allowed size for client request body (file uploads)
	client_max_body_size 32m;

	# Logging Configuration
	access_log /var/log/nginx/expotest.access.log;                # Access log file path
	error_log  /var/log/nginx/expotest.error.log warn;            # Error log file path and level

	# TLS/SSL Certificate Configuration
	# These paths are automatically created by Certbot/Let's Encrypt
	ssl_certificate /etc/letsencrypt/live/expotest.tw1.su/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/expotest.tw1.su/privkey.pem;
	
	# Include recommended SSL security options from Let's Encrypt
	# Note: These files are created by certbot, comment out if not available yet
	# include /etc/letsencrypt/options-ssl-nginx.conf;
	
	# Diffie-Hellman parameters for perfect forward secrecy
	# Note: This file is created by certbot, comment out if not available yet
	# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	# Security Headers for enhanced protection
	add_header X-Content-Type-Options nosniff;                    # Prevent MIME type sniffing
	add_header X-Frame-Options SAMEORIGIN;                        # Prevent clickjacking
	add_header X-XSS-Protection "1; mode=block";                  # Enable XSS protection
	add_header Referrer-Policy same-origin;                       # Control referrer information
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=()"; # Restrict permissions

	# Include common Grav CMS configuration and PHP-FPM handling
	include snippets/grav-common.conf;
	include snippets/php-fpm.conf;
}


