# Nginx: только HTTP — для первого запуска и получения сертификата Certbot.
# Использовать до получения сертификата, затем переключиться на litrep.conf.
# Копировать в /etc/nginx/sites-available/ как litrep.conf и включить сайт.

server {
	listen 80;
	listen [::]:80;
	server_name litrep.ru www.litrep.ru;

	root /var/www/litrep;
	index index.php index.html;
	client_max_body_size 64m;

	# Let's Encrypt ACME (обязательно для certbot certonly --webroot)
	location ^~ /.well-known/acme-challenge/ {
		default_type "text/plain";
		root /var/www/litrep;
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	access_log /var/log/nginx/litrep.access.log;
	error_log  /var/log/nginx/litrep.error.log warn;

	add_header X-Content-Type-Options nosniff;
	add_header X-Frame-Options SAMEORIGIN;

	include snippets/grav-common.conf;
	include snippets/php-fpm.conf;
}
