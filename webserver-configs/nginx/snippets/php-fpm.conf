# PHP-FPM Configuration Snippet for Grav CMS
# This file handles PHP processing through FastCGI Process Manager

# Location block that matches all PHP files
# The ~ operator means case-sensitive regex matching
location ~ \.php$ {
	# Split the path info to separate the script name from the path info
	# This is important for proper URL rewriting and routing
	fastcgi_split_path_info ^(.+\.php)(/.+)$;
	
	# Set the default index file for PHP processing
	fastcgi_index index.php;
	
	# Include standard FastCGI parameters (PATH_INFO, QUERY_STRING, etc.)
	include fastcgi_params;
	
	# FastCGI backend connection - Unix socket for better performance
	# IMPORTANT: Adjust this path to match your installed PHP version
	# Common paths:
	# - Ubuntu 22.04+ / Debian 12+: /run/php/php8.3-fpm.sock
	# - Ubuntu 20.04 / Debian 11: /run/php/php8.1-fpm.sock
	# - Ubuntu 18.04 / Debian 10: /run/php/php7.4-fpm.sock
	fastcgi_pass unix:/run/php/php8.3-fpm.sock;
	
	# Alternative connection methods (uncomment if needed):
	# fastcgi_pass unix:/var/run/php/php-fpm.sock;    # Generic socket path
	# fastcgi_pass 127.0.0.1:9000;                    # TCP/IP connection
	
	# Set the script filename parameter for FastCGI
	# This tells PHP where the actual script file is located
	fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
	# Pass HTTPS to PHP when behind SSL (for Grav and other apps)
	fastcgi_param HTTPS $https if_not_empty;
}


