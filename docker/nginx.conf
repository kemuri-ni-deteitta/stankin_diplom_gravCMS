server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name litrep.ru www.litrep.ru;
    root /var/www/html;
    index index.php index.html index.htm;

    client_max_body_size 256M;
    client_body_timeout 600s;
    client_header_timeout 600s;

    # Allow Let's Encrypt ACME challenge over HTTP
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    # Serve the site on HTTP if HTTPS is not available
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling for HTTP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        
        # Increase timeouts for form processing
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_connect_timeout 600;
        
        # Buffer settings for large forms
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        
        # Additional debugging and error handling
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name litrep.ru www.litrep.ru;
    root /var/www/html;
    index index.php index.html index.htm;

    client_max_body_size 256M;
    client_body_timeout 600s;
    client_header_timeout 600s;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/litrep.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/litrep.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # Allow Let's Encrypt ACME challenge over HTTPS too
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
        allow all;
    }

    # Primary routing: static first, then front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param HTTPS on;
        
        # Increase timeouts for form processing
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_connect_timeout 600;
        
        # Buffer settings for large forms
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        
        # Additional debugging and error handling
        fastcgi_intercept_errors on;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Log slow requests
        access_log /var/log/nginx/slow_php.log;
    }

    # Cache headers for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Security: deny access to hidden files and sensitive paths
    location ~* /\.(?:git|hg|svn) {
        deny all;
    }

    location ~ /\.[^/]+$ {
        deny all;
    }

    location ~* /(LICENSE\.txt|composer\.(json|lock))$ {
        deny all;
    }

    # Do not serve application cache/log directories directly
    location ~* /(cache|logs)/ {
        deny all;
    }
}


